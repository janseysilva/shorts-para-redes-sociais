# Monta o instalador do "Declarações Escolares" num Windows do GitHub
# (PyInstaller + Inno Setup) e publica em Releases para baixar.
name: Instalador Declarações Escolares

on:
  workflow_dispatch:
  push:
    paths:
      - "declaracoes-escolares/declaracoes_escolares.py"
      - "declaracoes-escolares/DeclaracoesEscolares.spec"
      - "declaracoes-escolares/instalador_declaracoes.iss"
      - "declaracoes-escolares/icone_declaracoes.ico"
      - "declaracoes-escolares/requirements.txt"
      - ".github/workflows/instalador-declaracoes.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: declaracoes-escolares
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar componentes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Teste rápido (ler alunos e gerar PDF/Word)
        run: |
          python -c "import tkinter, declaracoes_escolares as d; a=d.ler_lista('Nome;Sexo;Fase;Turma\nANA TESTE;F;1 PERIODO;A\n'); assert len(a)==1; p=d.paragrafos('matricula', a[0], {}, 2026); d.gerar_pdf('t.pdf', d.CONFIG_PADRAO, 'matricula', p, 'No 001/2026', ''); d.gerar_word('t.docx', d.CONFIG_PADRAO, 'matricula', p, 'No 001/2026', ''); print('ok')"

      - name: Gerar o .exe (PyInstaller)
        run: python -m PyInstaller --noconfirm DeclaracoesEscolares.spec

      - name: Gerar o instalador (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc instalador_declaracoes.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem .. -Filter "Instalador_DeclaracoesEscolares.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Instalador_DeclaracoesEscolares
          path: |
            Instalador_DeclaracoesEscolares.exe
            declaracoes-escolares/dist/DeclaracoesEscolares.exe

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versao = (Select-String -Path declaracoes_escolares.py -Pattern 'VERSAO_PROGRAMA = "(.+)"').Matches[0].Groups[1].Value
          $tag = "declaracoes-v$versao-build${{ github.run_number }}"
          gh release create $tag ../Instalador_DeclaracoesEscolares.exe `
            --target "${{ github.sha }}" `
            --title "Declarações Escolares $versao (build ${{ github.run_number }})" `
            --notes "Instalador do Declarações Escolares. Baixe o arquivo Instalador_DeclaracoesEscolares.exe abaixo e dê dois cliques."
